spring.application.name=unilink-backend
server.port=${SERVER_PORT:8080}
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/unilink}
spring.data.mongodb.auto-index-creation=true
app.jwt.secret=${JWT_SECRET:unilink-local-development-secret-key-change-me}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
